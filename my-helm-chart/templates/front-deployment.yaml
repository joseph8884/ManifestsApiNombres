apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-helm-chart.fullname" . }}-front
spec:
  replicas: {{ .Values.front.replicas }}
  selector:
    matchLabels:
      app: {{ include "my-helm-chart.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "my-helm-chart.fullname" . }}
    spec:
      containers:
      - name: front
        image: {{ .Values.front.image }}
        ports:
        - containerPort: {{ .Values.front.port }}
        resources:
          requests:
            cpu: {{ .Values.front.resources.requests.cpu }}
          limits:
            cpu: {{ .Values.front.resources.limits.cpu }}