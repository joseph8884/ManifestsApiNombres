apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2 
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /backend(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: my-helm-chart2-0-1740268582-my-helm-chart2-api-service  
            port:
              number: 80
      - path: /front(/|$)(.*)  
        pathType: Prefix
        backend:
          service:
            name: my-helm-chart2-0-1740268582-my-helm-chart2-front-service 
            port:
              number: 80
