apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-helm-chart2.fullname" . }}-mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: admin
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: admin
        - name: MONGO_INITDB_DATABASE
          value: personas
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
        resources:
          requests:
            cpu: "50m"
          limits:
            cpu: "350m"
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: {{ include "my-helm-chart2.fullname" . }}-mongodb-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "my-helm-chart2.fullname" . }}-mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi