app:
  name: my-app
  image:
    repository: abril21/k8spersonas-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  replicaCount: 1
  env:
    - name: EXAMPLE_ENV_VAR
      value: example_value

mongodb:
  image:
    repository: mongo
    tag: latest
  rootUsername: admin
  rootPassword: admin
  database: personas
  storage:
    size: 5Gi

front:
  image:
    repository: abril21/k8spersonas-front
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  cpuUtilization: 75

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  paths:
    - path: /backend(/|$)(.*)
      serviceName: api-service
      servicePort: 80
    - path: /front(/|$)(.*)
      serviceName: front-service
      servicePort: 80

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}