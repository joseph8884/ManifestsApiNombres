apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "my-helm-chart2.fullname" . }}-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontprod
  template:
    metadata:
      labels:
        app: frontprod
    spec:
      containers:
      - name: frontprod
        image: abril21/k8spersonas-front:latest  # Replace with your actual image
        ports:
        - containerPort: 5173 
        resources:
          requests:
            cpu: "10m"
          limits:
            cpu: "350m"